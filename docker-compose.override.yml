# Development overrides: bind-mounted source, hot reload, dev dependencies.
# Compose loads this automatically; skip it in CI/production with
#   docker compose -f docker-compose.yml up
services:
  backend:
    build:
      target: dev
    # uv sync first: the backend_venv volume outlives image rebuilds, so a
    # dependency added to uv.lock would otherwise never reach the container.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level ${LOG_LEVEL:-info}"
    environment:
      APP_ENV: development
    volumes:
      - ./backend:/app
      # keep the image's virtualenv from being shadowed by the host mount
      - backend_venv:/app/.venv

  frontend:
    build:
      target: dev
    # Restore the lockfile-built Linux dependencies into the persistent volume;
    # the source bind mount must not expose Windows node_modules to the container.
    command: >
      sh -c "mkdir -p /app/node_modules && cp -a /opt/spry-node-modules/. /app/node_modules/ && pnpm dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules_v2:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_venv:
  frontend_node_modules_v2:
  frontend_next:
