AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry AI Agenda Parser (Lab 6) - Stateless Lambda function running outside the VPC,
  invoking Claude on Amazon Bedrock via Anthropic Messages API or Converse API.

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Project tag prefix for resources.

  ImageUri:
    Type: String
    Description: Container image URI in ECR (backend image with agenda_lambda handler).

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: CPU architecture for the Lambda function.

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock foundation model ID or cross-region inference profile.

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID for token verification.

  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito Client ID for token audience verification.

  CognitoRegion:
    Type: String
    Default: us-east-1
    Description: AWS region where Cognito user pool resides.

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated list of allowed CORS origins.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: Days to retain CloudWatch logs.

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:Converse"
                  - "bedrock:ConverseStream"
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LogGroup
      - AgendaParserRole
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: "Spry AI Agenda Parser using Claude on Amazon Bedrock"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Role: !GetAtt AgendaParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Architectures:
        - !Ref Architecture
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_REGION: !Ref CognitoRegion
          CORS_ORIGINS: !Ref CorsOrigins
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AgendaParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"
        MaxAge: 300

  AgendaParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AgendaParserUrl:
    Description: Public Lambda Function URL for Agenda Parser
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl

  AgendaParserFunctionArn:
    Description: ARN of the Agenda Parser Lambda function
    Value: !GetAtt AgendaParserFunction.Arn
